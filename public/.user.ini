; Batas unggah untuk modul Dokumen (berkas s.d. 100MB).
; Berlaku di hosting PHP-FPM/CGI (umumnya cPanel). Jika tidak berpengaruh,
; atur nilai yang sama lewat cPanel > MultiPHP INI Editor.
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
